<!DOCTYPE html>
<html>
<head>
<title>Unblooked Games</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background:
    radial-gradient(circle at top, #17345c, #050814 70%);
    color: white;
}

/* Moving futuristic background */
body::before {
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle, rgba(0,200,255,.15) 2px, transparent 3px);
    background-size:60px 60px;
    animation: move 20s linear infinite;
}

@keyframes move {
    from {transform:translate(0,0);}
    to {transform:translate(-200px,-200px);}
}


.hud {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:600px;
    padding:50px;
    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;

    box-shadow:
    0 0 40px rgba(0,200,255,.3);
}


h1 {
    font-size:55px;
    letter-spacing:5px;

    text-shadow:
    0 0 10px #00eaff,
    0 0 30px #008cff;
}


p {
    margin:20px;
    color:#cbd5ff;
}


button {
    margin-top:20px;
    padding:18px 60px;

    font-size:20px;
    color:white;

    background:#00aaff;
    border:none;
    border-radius:50px;

    cursor:pointer;

    box-shadow:
    0 0 20px #00aaff;

    transition:.3s;
}


button:hover {
    transform:scale(1.1);
    box-shadow:
    0 0 50px #00ffff;
}


.scan {
    position:absolute;
    width:100%;
    height:2px;
    background:#00ffff;
    animation:scan 4s infinite;
    opacity:.4;
}


@keyframes scan {
    0% {top:0;}
    100% {top:100%;}
}

</style>
</head>


<body>

<div class="scan"></div>

<div class="hud">

<h1>🎮 UNBLOOKED</h1>

<p>
ENTER THE FUTURE OF BROWSER GAMING
</p>

<button>
ENTER HUB
</button>

</div>


</body>
</html>
