    cursorDot.style.top = e.clientY + "px";

});


function refreshCursorTargets() {

    document.querySelectorAll(

            "mouseenter",
            () => cursor.classList.add("big")
        );

        element.addEventListener(
            "mouseleave",
            () => cursor.classList.remove("big")
        );

    });

}

/* =========================================================
   SEARCH
   ========================================================= */

const search =
    document.getElementById("search");

const games =
    document.querySelectorAll(".game");

const categories =
    document.querySelectorAll(".category");

const noResults =
    document.getElementById("noResults");

let currentCategory = "all";


function updateGames() {

    const query =
        search.value.toLowerCase().trim();

    let visible = 0;

    games.forEach(game => {

        const name =
            game.dataset.name.toLowerCase();

        const category =
            game.dataset.category;

        const searchMatch =
            name.includes(query);

        const categoryMatch =
            currentCategory === "all" ||
            category === currentCategory;

        if (
            searchMatch &&
            categoryMatch
        ) {

            game.classList.remove("hidden");

            visible++;

        } else {

            game.classList.add("hidden");

        }

    });

    noResults.style.display =
        visible === 0 ? "block" : "none";

}


search.addEventListener(
    "input",
    updateGames
);


/* =========================================================
   CATEGORIES
   ========================================================= */

categories.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            categories.forEach(
                b => b.classList.remove("active")
            );

            button.classList.add("active");

            currentCategory =
                button.dataset.category;

            updateGames();

        }
    );

});


/* =========================================================
   RECENTLY PLAYED
   ========================================================= */

function savePlayed(name) {

    let recent =
        JSON.parse(
            localStorage.getItem("pstylaRecent") || "[]"
        );

    recent =
        recent.filter(item => item !== name);

    recent.unshift(name);

    recent =
        recent.slice(0, 5);

    localStorage.setItem(
        "pstylaRecent",
        JSON.stringify(recent)
    );

    loadRecent();

}


function loadRecent() {

    const container =
        document.getElementById("recentGames");

    if (!container)
        return;

    const recent =
        JSON.parse(
            localStorage.getItem("pstylaRecent") || "[]"
        );

    container.innerHTML = "";

    recent.forEach(name => {

        const original =
            [...games].find(
                game =>
                game.dataset.name === name
            );

        if (!original)
            return;

        const clone =
            original.cloneNode(true);

        clone.classList.remove("hidden");

        container.appendChild(clone);

    });

    refreshCursorTargets();

}

loadRecent();


/* =========================================================
   RANDOM GAME
   ========================================================= */

const randomButton =
    document.getElementById("randomButton");

if (randomButton) {

    randomButton.addEventListener(
        "click",
        () => {

            const available =
                [...games].filter(
                    game =>
                    !game.classList.contains("hidden")
                );

            if (!available.length)
                return;

            const chosen =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];

            chosen.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            chosen.style.boxShadow =
                "0 0 45px rgba(168,85,247,.95)";

            setTimeout(() => {

                chosen.style.boxShadow = "";

            }, 1800);

            savePlayed(
                chosen.dataset.name
            );

        }
    );

}

/* =========================================================
   MUSIC
   ========================================================= */

const musicButton =
    document.getElementById("musicButton");

let player;

let currentSong = 0;

const songs = [
    "85wZGRcHHAc",
    "-5CTaDGlhZU"
];

let musicOn = true;


const tag =
    document.createElement("script");

tag.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "youtubePlayer",
            {

                height:"1",
                width:"1",

                videoId:
                    songs[currentSong],

                playerVars: {

                    autoplay:0,
                    controls:0,
                    playsinline:1,
                    origin:
                        window.location.origin

                },

                events: {

                    onReady:function() {

                        player.setVolume(35);

                    },

                    onStateChange:
                        onPlayerStateChange

                }

            }
        );

}


if (musicButton) {

    musicButton.addEventListener(
        "click",
        () => {

            if (!player)
                return;

            if (musicOn) {

                player.pauseVideo();

                musicButton.textContent =
                    "🔇";

                musicOn = false;

            } else {

                player.playVideo();

                musicButton.textContent =
                    "🎵";

                musicOn = true;

            }

        }
    );

}


function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        currentSong++;

        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }

        player.loadVideoById(
            songs[currentSong]
        );

    }

}
